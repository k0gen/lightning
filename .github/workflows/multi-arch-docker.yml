name: Multi-Arch Docker Build (Pure Native)

on:
  workflow_dispatch:
  push:
    branches: [master, 'build/**']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Native Environment
        run: |
          echo "🏗️  Building on: $(uname -m)"
          echo "🐳  Docker version: $(docker version --format '{{.Server.Version}}')"
          
          # Remove any existing QEMU setup
          docker buildx ls
          docker buildx rm --all-inactive || true

      - name: Extract metadata  
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Pure native Docker build - no buildx
      - name: Build with Native Docker
        run: |
          echo "🚀 Building ${{ matrix.platform }} natively on $(uname -m)"
          
          # Build using native docker (not buildx)
          docker build \
            --tag ${{ steps.meta.outputs.tags }} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "📤 Pushing image..."
            docker push ${{ steps.meta.outputs.tags }}
          fi

      - name: Test Native Build
        run: |
          echo "✅ Testing native build..."
          docker run --rm ${{ steps.meta.outputs.tags }} uname -m
          docker run --rm ${{ steps.meta.outputs.tags }} lightningd --version

  # Merge step to create multi-arch manifest
  merge:
    runs-on: ubuntu-24.04  
    needs: build
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          # Create and push multi-arch manifest
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64
