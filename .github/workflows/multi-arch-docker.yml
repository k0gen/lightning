name: Multi-Arch Docker Build (Native + Architecture Override)

on:
  workflow_dispatch:
  push:
    branches: [master, 'build/**']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
            dockerfile_arch: x86_64-linux-gnu
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            dockerfile_arch: aarch64-linux-gnu
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Native Environment
        run: |
          echo "🏗️  Building ${{ matrix.platform }} natively on $(uname -m)"
          echo "🐳  Docker info:"
          docker info | grep -E "(Architecture|OSType)"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Build with architecture override - works with CLN Dockerfile
      - name: Build natively with architecture override
        run: |
          echo "🚀 Building ${{ matrix.platform }} natively on $(uname -m)"
          
          # Build with explicit platform and build args that match the Dockerfile expectations
          docker build \
            --platform ${{ matrix.platform }} \
            --build-arg BUILDPLATFORM=${{ matrix.platform }} \
            --build-arg TARGETPLATFORM=${{ matrix.platform }} \
            --build-arg TARGETOS=linux \
            --build-arg TARGETARCH=${{ matrix.arch }} \
            --tag ${{ steps.meta.outputs.tags }} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

      - name: Test native build
        run: |
          echo "✅ Testing native ${{ matrix.platform }} build..."
          
          # Test the image runs natively
          docker run --rm ${{ steps.meta.outputs.tags }} uname -m
          
          # Test that it's the right architecture
          CONTAINER_ARCH=$(docker run --rm ${{ steps.meta.outputs.tags }} uname -m)
          HOST_ARCH=$(uname -m)
          
          echo "Host architecture: $HOST_ARCH"
          echo "Container architecture: $CONTAINER_ARCH"
          
          # Verify they match (aarch64 == arm64, x86_64 == amd64)
          if [[ "$HOST_ARCH" == "aarch64" && "$CONTAINER_ARCH" == "aarch64" ]] || \
             [[ "$HOST_ARCH" == "x86_64" && "$CONTAINER_ARCH" == "x86_64" ]]; then
            echo "🎉 Architecture match confirmed - native build successful!"
          else
            echo "❌ Architecture mismatch detected"
            exit 1
          fi

      - name: Push native image
        if: github.event_name != 'pull_request'
        run: |
          echo "📤 Pushing ${{ matrix.platform }} image..."
          docker push ${{ steps.meta.outputs.tags }}

  # Rest of the workflow (manifest creation) stays the same...
  manifest:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest
        run: |
          echo "📦 Creating multi-arch manifest..."
          
          # Extract the base tag name for the architecture-specific images
          BASE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          
          docker buildx imagetools create -t ${BASE_TAG} \
            ${BASE_TAG}-amd64 \
            ${BASE_TAG}-arm64

      - name: Inspect final manifest
        run: |
          echo "🔍 Final multi-arch manifest:"
          BASE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker buildx imagetools inspect ${BASE_TAG}
