name: Multi-Arch Docker Build (Minimal Buildx)

on:
  workflow_dispatch:
  push:
    branches: [master, 'build/**']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Native Environment
        run: |
          echo "🏗️  Building ${{ matrix.platform }} natively on $(uname -m)"

      # ✅ Minimal buildx setup - native platform only
      - name: Set up Docker Buildx (Native Only)
        run: |
          # Create a builder for ONLY the current platform - no QEMU
          docker buildx create \
            --name native-builder \
            --driver docker-container \
            --platform ${{ matrix.platform }} \
            --use
          
          # Bootstrap and verify
          docker buildx inspect --bootstrap
          
          # Confirm no QEMU platforms
          echo "Builder platforms:"
          docker buildx inspect | grep Platforms

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Use buildx but ONLY for the native platform
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # ✅ Single platform only - no cross-compilation
          platforms: ${{ matrix.platform }}
          builder: native-builder
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No caching for now to avoid complexity
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Test build
        run: |
          echo "✅ ${{ matrix.platform }} built successfully on ${{ matrix.runner }}"
