name: Multi-Arch Docker Build (Pure Native)

on:
  workflow_dispatch:
  push:
    branches: [master, 'build/**']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image-amd64: ${{ steps.image.outputs.image }}
      image-arm64: ${{ steps.image.outputs.image }}
      digest-amd64: ${{ steps.build.outputs.digest }}
      digest-arm64: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Native Environment
        run: |
          echo "🏗️  Building ${{ matrix.platform }} natively on $(uname -m)"
          echo "🐳  Docker version: $(docker version --format '{{.Server.Version}}')"
          
          # Ensure no QEMU is involved
          echo "🚫  No QEMU setup - building natively only"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Set image output
        id: image
        run: echo "image=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build natively
        id: build
        run: |
          echo "🚀 Building ${{ matrix.platform }} natively on $(uname -m)"
          echo "📋 Expected inside container: $(uname -m)"
          
          # Pure Docker build (not buildx) - guarantees native execution
          docker build \
            --tag ${{ steps.meta.outputs.tags }} \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .
          
          # Get the image digest for manifest creation
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.meta.outputs.tags }} | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Test native build
        run: |
          echo "✅ Testing that build is truly native..."
          
          # Verify the image runs natively and detects correct architecture
          docker run --rm ${{ steps.meta.outputs.tags }} uname -m
          
          # Test that uv would detect the right architecture
          docker run --rm ${{ steps.meta.outputs.tags }} uname -s -m
          
          echo "🎉 Native ${{ matrix.platform }} build successful!"

      - name: Push native image
        if: github.event_name != 'pull_request'
        run: |
          echo "📤 Pushing ${{ matrix.platform }} image..."
          docker push ${{ steps.meta.outputs.tags }}

  # Create multi-arch manifest (only if both builds succeeded)
  manifest:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for manifest
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create and push manifest
        run: |
          echo "📦 Creating multi-arch manifest..."
          
          # Create multi-arch manifest pointing to single-arch images
          docker buildx imagetools create -t ${{ steps.meta.outputs.tags }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-arm64

      - name: Inspect final manifest
        run: |
          echo "🔍 Final multi-arch manifest:"
          docker buildx imagetools inspect ${{ steps.meta.outputs.tags }}

  test:
    runs-on: ubuntu-24.04
    needs: manifest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Test multi-arch manifest
        run: |
          echo "🧪 Testing multi-arch image selection..."
          
          # Test AMD64 selection
          docker run --rm --platform linux/amd64 ${{ steps.meta.outputs.tags }} uname -m
          
          # Test ARM64 selection
          docker run --rm --platform linux/arm64 ${{ steps.meta.outputs.tags }} uname -m
          
          echo "✅ Multi-arch manifest working correctly!"
