name: Multi-Arch Docker Build (Native Runners)

on:
  workflow_dispatch:
  push:
    branches: [master, 'build/**']
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare
        run: |
          echo "PLATFORM_PAIR=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "Running on: $(uname -m)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # ❌ REMOVE this step - it creates a QEMU-enabled builder
      # - name: Set up Docker Buildx  
      #   uses: docker/setup-buildx-action@v3

      # ✅ Use native Docker daemon directly
      - name: Set up Docker (Native)
        run: |
          # Verify we're running natively  
          echo "Architecture: $(uname -m)"
          echo "Available platforms: $(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')"
          
          # Use default builder (native daemon) instead of creating new one
          docker buildx use default || true
          docker buildx inspect --bootstrap

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ Force native building
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # ✅ Single platform per job - no cross-compilation needed
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ✅ Use native builder
          builder: default
          # ✅ Enhanced caching
          cache-from: type=gha,scope=buildkit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=buildkit-${{ matrix.arch }}
          # ✅ Build arguments to ensure native execution
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            TARGETPLATFORM=${{ matrix.platform }}
            BUILDPLATFORM=${{ matrix.platform }}

      # ✅ Validate the build
      - name: Test build
        run: |
          echo "✅ ${{ matrix.platform }} built successfully on ${{ matrix.runner }}"
          echo "Host architecture: $(uname -m)"
          echo "Docker info:"
          docker info | grep -E "(Architecture|OSType)"
          
          # Test that we can run the image natively
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Testing image natively..."
            docker run --rm --platform ${{ matrix.platform }} ${{ steps.meta.outputs.tags }} uname -m || echo "Image test skipped"
          fi
